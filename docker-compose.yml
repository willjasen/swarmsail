version: "3.8"
services:
  headscale-1:
    image: headscale/headscale:latest
    restart: unless-stopped
    container_name: headscale-1
    volumes:
      - ./headscale/1/config:/etc/headscale
      - ./headscale/1/data:/var/lib/headscale
    ports:
      - 8081:8080
      - 3478:3478/udp
    command: serve
    networks:
      - npm-net
  headscale-2:
    image: headscale/headscale:latest
    restart: unless-stopped
    container_name: headscale-2
    volumes:
      - ./headscale/2/config:/etc/headscale
      - ./headscale/2/data:/var/lib/headscale
    ports:
      - 8082:8080
      - 3479:3478/udp
    command: serve
    networks:
      - npm-net
  npmplus:
    container_name: npmplus
    image: docker.io/zoeyvid/npmplus:latest
    restart: unless-stopped
    networks:
      - npm-net
    ports:
      - 80:80
      - 80:80/udp
      - 81:81
      - 443:443
      - 443:443/udp
    volumes:
      - ./npm/data:/data
    environment:
      - TZ=America/New_York
      - ACME_EMAIL=
      - LOGROTATE=true
networks:
  npm-net:
    driver: bridge
