services:
  control-plane:
    build:
      context: .
      dockerfile: Dockerfile.orbstack
    image: swarmsail:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - type: bind
        source: ${SWARMSAIL_LOCAL_DATA_DIR:?Set SWARMSAIL_LOCAL_DATA_DIR to a node-local folder}
        target: /data
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/healthz', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - private

  npmplus:
    image: docker.io/zoeyvid/npmplus:latest
    profiles: ["npm"]
    restart: unless-stopped
    ports:
      - "${SWARMSAIL_LAN_IP:?Set SWARMSAIL_LAN_IP to the MacBook LAN address}:80:80"
      - "${SWARMSAIL_LAN_IP}:${SWARMSAIL_NPM_HTTPS_PORT:-8443}:443"
      - "${SWARMSAIL_LAN_IP}:${SWARMSAIL_NPM_HTTPS_PORT:-8443}:443/udp"
      - "127.0.0.1:8181:81"
    environment:
      TZ: America/New_York
      LOGROTATE: "true"
    volumes:
      - type: bind
        source: ${SWARMSAIL_LOCAL_DATA_DIR}/npm/data
        target: /data
    networks:
      - private

  crowdsec:
    image: docker.io/crowdsecurity/crowdsec:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:7422:8080"
    environment:
      TZ: America/New_York
      COLLECTIONS: "crowdsecurity/caddy ZoeyVid/npmplus"
    volumes:
      - type: bind
        source: ${SWARMSAIL_LOCAL_DATA_DIR}/crowdsec/conf
        target: /etc/crowdsec
      - type: bind
        source: ${SWARMSAIL_LOCAL_DATA_DIR}/crowdsec/data
        target: /var/lib/crowdsec/data
      - type: bind
        source: ${SWARMSAIL_LOCAL_DATA_DIR}/caddy/logs
        target: /var/log/caddy
        read_only: true
      - type: bind
        source: ${SWARMSAIL_LOCAL_DATA_DIR}/npm/data/nginx
        target: /opt/npmplus/nginx
        read_only: true
    networks:
      - private

networks:
  private:
    name: swarmsail-local-private
    driver: bridge
